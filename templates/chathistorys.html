<script>
function formatChatMessage(text) {
    return text
        // Bold (**text**)
        .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')

        // Numbered headings
        .replace(/(\d+)\.\s+/g, '<br><strong>$1.</strong> ')

        // Bullet points
        .replace(/\*\s+/g, '• ')

        // Line breaks
        .replace(/\n\n/g, '<br><br>')
        .replace(/\n/g, '<br>');
}

document.addEventListener("DOMContentLoaded", function () {
    document.querySelectorAll(".chat-message").forEach(td => {
        const rawText = td.dataset.message;
        td.innerHTML = formatChatMessage(rawText);
    });
});
</script>
